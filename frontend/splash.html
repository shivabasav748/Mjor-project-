<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="VentureIQ — AI-powered startup intelligence"
    >


    <title>VentureIQ</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Splash CSS -->
    <link
        rel="stylesheet"
        href="css/splash.css"
    >

</head>


<body>


    <!-- =====================================================
         VENTUREIQ SPLASH SCREEN
    ====================================================== -->

    <main class="splash-screen" id="splashScreen">


        <!-- Background Effects -->

        <div class="background-glow glow-one"></div>

        <div class="background-glow glow-two"></div>

        <div class="grid-background"></div>


        <!-- Main Content -->

        <section class="splash-content">


            <!-- Animated Logo -->

            <div class="logo-container">

                <div class="logo-ring ring-one"></div>

                <div class="logo-ring ring-two"></div>


                <div class="logo-mark">

                    <span>V</span>

                </div>

            </div>


            <!-- Brand -->

            <div class="brand-container">

                <h1 class="brand-name">
                    Venture<span>IQ</span>
                </h1>

                <div class="brand-line"></div>

                <p class="brand-tagline">
                    AI-POWERED STARTUP INTELLIGENCE
                </p>

            </div>


            <!-- Loading Message -->

            <div class="loading-container">

                <div class="loading-text">

                    <span>
                        Initializing intelligence
                    </span>

                    <span class="loading-dots">
                        <i></i>
                        <i></i>
                        <i></i>
                    </span>

                </div>


                <div class="loading-bar">

                    <span id="loadingProgress"></span>

                </div>

            </div>


            <!-- Bottom Statement -->

            <p class="splash-statement">
                Think smarter.
                <span>Validate better.</span>
                Build with confidence.
            </p>


        </section>


        <!-- Bottom Corner -->

        <div class="splash-footer">

            <span>
                <i class="fa-solid fa-sparkles"></i>
                Venture Intelligence Platform
            </span>

            <span>
                © 2026 VentureIQ
            </span>

        </div>


    </main>


    <!-- Splash JavaScript -->

    <script src="js/splash.js"></script>


</body>

</html>
